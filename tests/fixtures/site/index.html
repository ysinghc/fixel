<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture shop</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 sans-serif;color:#111;background:#fff}
  @media (prefers-color-scheme:dark){body{color:#eee;background:#111}}
  header{padding:12px 16px;border-bottom:1px solid #ddd}
  main{padding:16px}
  .promo{width:480px;background:#fde;padding:12px}          /* BUG: fixed width, overflows narrow viewports */
  .row{display:flex;gap:8px;margin-top:16px}
  .tiny{width:16px;height:16px;padding:0}                    /* BUG: small tap target */
</style>
<header><strong>Fixture shop</strong></header>
<main>
  <h1>Welcome</h1>
  <div class="promo"><p>Free shipping on orders over fifty dollars this week only</p></div>
  <div class="row"><button class="tiny" aria-label="close"></button><button>Browse catalog</button></div>
</main>
