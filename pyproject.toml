[project]
name = "fixel"
version = "0.0.1"
description = "Finds visual layout bugs across a viewport matrix, proves them with pixels, and ships only verified CSS patches."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "openai",
  "playwright",
  "httpx",
  "numpy",
  "pillow",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
fixel = "fixel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
